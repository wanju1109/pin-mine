<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>금광 두더지 - Pin Mine</title>
<style>
html,body{margin:0;height:100%;background:#07191c;overflow:hidden;touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{display:flex;align-items:center;justify-content:center}
canvas{display:block;touch-action:pan-y;border-radius:12px}

<body>
<canvas id="c" tabindex="0" aria-label="금광 두더지. Enter 시작, 숫자키 핀 뽑기, Z 되돌리기, H 힌트, R 다시."></canvas>
<script id="core">
// 물리·레벨 생성 핵심부: 본 페이지와 생성 워커가 함께 쓴다
var PMCore = (() => {
'use strict';
// ---------- 격자와 물리 ----------
const W = 30, H = 46, CS = 12, GX = 20, GY = 82;
const E = 0, WALL = 1, PIN = 2, GOLD = 3, WATER = 4, LAVA = 5, STONE = 6, ASH = 7;
const CART_TOP = 37, CART_L = 7, CART_R = 22;
const SETTLE = 40;
let STAMP = 0;
const mark = new Uint32Array(W * H);

function makeSim(g) {
  return { g: Uint8Array.from(g), dir: new Int8Array(W * H), tick: 0, still: 0, lavaHome: false, fx: null };
}
function cloneSim(s) {
  return { g: Uint8Array.from(s.g), dir: Int8Array.from(s.dir), tick: s.tick, still: s.still, lavaHome: s.lavaHome, fx: null };
}

function step(s) {
  const g = s.g, dir = s.dir, t = ++s.tick, st = ++STAMP;
  let mv = 0;
  const lr = t & 1, lavaTurn = (t & 1) === 0;
  for (let y = H - 2; y >= 1; y--) {
    const row = y * W;
    for (let i = 1; i < W - 1; i++) {
      const x = lr ? i : W - 1 - i, k = row + x, c = g[k];
      if (c < GOLD || mark[k] === st) continue;
      const b = k + W;
      if (c === WATER || c === LAVA) {
        if (c === LAVA && !lavaTurn) continue;
        if (g[b] === E) { g[b] = c; g[k] = E; dir[b] = dir[k]; mark[b] = st; mv++; continue; }
        let d = dir[k] || (((x + y + t) & 1) ? 1 : -1);
        if (g[b + d] === E) { g[b + d] = c; g[k] = E; dir[b + d] = d; mark[b + d] = st; mv++; continue; }
        if (g[b - d] === E) { g[b - d] = c; g[k] = E; dir[b - d] = -d; mark[b - d] = st; mv++; continue; }
        const n = c === WATER ? 3 : 2;
        let p = k, moved = 0;
        for (let j = 0; j < n; j++) {
          const q = p + d;
          if (g[q] !== E) break;
          p = q; moved++;
          if (g[q + W] === E) break;
        }
        if (moved) { g[p] = c; g[k] = E; dir[p] = d; mark[p] = st; } else dir[k] = -d;
        continue;
      }
      // 가루(금, 돌, 재): 액체 속으로 가라앉는다
      const bc = g[b];
      if (bc === E || bc === WATER || bc === LAVA) {
        g[b] = c; g[k] = bc; dir[k] = dir[b]; mark[b] = st; mark[k] = st; mv++; continue;
      }
      const d = ((x + t) & 1) ? 1 : -1;
      let q = b + d, qc = g[q];
      if (qc === E || qc === WATER || qc === LAVA) { g[q] = c; g[k] = qc; mark[q] = st; mark[k] = st; mv++; continue; }
      q = b - d; qc = g[q];
      if (qc === E || qc === WATER || qc === LAVA) { g[q] = c; g[k] = qc; mark[q] = st; mark[k] = st; mv++; continue; }
    }
  }
  // 반응: 용암+물 = 돌, 용암+금 = 재
  for (let k = W; k < W * (H - 1); k++) {
    if (g[k] !== LAVA) continue;
    const nb = [k - W, k + W, k - 1, k + 1];
    for (let j = 0; j < 4; j++) {
      const n = nb[j], c = g[n];
      if (c === GOLD) { g[n] = ASH; mv++; if (s.fx) s.fx.push(1, n); }
      else if (c === WATER) { g[k] = STONE; g[n] = E; mv++; if (s.fx) s.fx.push(0, n); break; }
    }
  }
  // 수레 바닥의 물은 빠져나간다
  const bot = (H - 2) * W;
  for (let x = CART_L; x <= CART_R; x++) if (g[bot + x] === WATER) { g[bot + x] = E; mv++; }
  for (let y = CART_TOP; y <= H - 2; y++) for (let x = CART_L; x <= CART_R; x++) if (g[y * W + x] === LAVA) s.lavaHome = true;
  s.still = mv ? 0 : s.still + 1;
}

function settle(s, max = 700) {
  for (let i = 0; i < max; i++) {
    step(s);
    if (s.lavaHome || s.still >= SETTLE) return;
  }
}
function goldHome(g) {
  let n = 0;
  for (let y = CART_TOP; y <= H - 2; y++) for (let x = CART_L; x <= CART_R; x++) if (g[y * W + x] === GOLD) n++;
  return n;
}
function goldAll(g) { let n = 0; for (let k = 0; k < g.length; k++) if (g[k] === GOLD) n++; return n; }
function removePin(g, pin) { for (const k of pin.cells) if (g[k] === PIN) g[k] = E; }

// ---------- 레벨 생성 ----------
function rngOf(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const pick = (r, a, b) => a + Math.floor(r() * (b - a + 1));

function params(L) {
  return {
    tiers: L <= 2 ? [1, 1] : L <= 5 ? [1, 2] : L <= 11 ? [2, 2] : [2, 3],
    rooms: L === 1 ? [1, 2] : L <= 9 ? [2, 3] : [3, 4],
    pins: L === 1 ? [1, 2] : L === 2 ? [2, 3] : L <= 4 ? [3, 4] : L <= 9 ? [3, 5] : L <= 15 ? [4, 5] : [4, 6],
    gold: L <= 6 ? [1, 1] : [1, 2],
    lava: L === 1 ? [0, 0] : L <= 6 ? [1, 1] : L <= 12 ? [1, 2] : [2, 3],
    pinFloor: 0.75,
    vpin: L < 4 ? 0 : L < 10 ? 0.25 : 0.4,
    maxWin: L <= 2 ? 1 : L === 3 ? 0.7 : L === 4 ? 0.6 : L <= 7 ? 0.5 : L <= 11 ? 0.35 : L <= 17 ? 0.25 : 0.15,
    minSol: L <= 2 ? 1 : L <= 6 ? 2 : 3,
    target: Math.min(0.85, 0.5 + L * 0.025),
    time: L < 6 ? 0 : Math.max(25, Math.round(75 - (L - 6) * 2.5)),
  };
}

function partition(total, c, minW, r) {
  const extra = total - c * minW;
  if (extra < 0) return null;
  const ws = []; let s = 0;
  for (let i = 0; i < c; i++) { const v = r() + 0.3; ws.push(v); s += v; }
  const out = ws.map(v => minW + Math.floor(extra * v / s));
  out[c - 1] += total - out.reduce((a, b) => a + b, 0);
  return out;
}

function genCandidate(P, r) {
  const g = new Uint8Array(W * H);
  const pinOf = new Int8Array(W * H).fill(-1);
  for (let x = 0; x < W; x++) { g[x] = WALL; g[(H - 1) * W + x] = WALL; }
  for (let y = 0; y < H; y++) { g[y * W] = WALL; g[y * W + W - 1] = WALL; }
  for (let i = 0; i < 7; i++) {
    const y = 31 + i;
    for (let x = 1; x <= i; x++) { g[y * W + x] = WALL; g[y * W + W - 1 - x] = WALL; }
  }
  for (let y = 38; y <= H - 2; y++) for (let x = 1; x <= 6; x++) { g[y * W + x] = WALL; g[y * W + W - 1 - x] = WALL; }

  const T = pick(r, P.tiers[0], P.tiers[1]);
  const floors = T === 1 ? [pick(r, 13, 17)] : T === 2 ? [pick(r, 12, 15), pick(r, 26, 29)] : [9, 19, 29];
  const rooms = [], pins = [];
  let top = 1;
  for (let t = 0; t < T; t++) {
    const floor = floors[t];
    const c = pick(r, P.rooms[0], P.rooms[1]);
    const widths = partition(28 - (c - 1), c, 5, r);
    if (!widths) return null;
    let x = 1;
    for (let i = 0; i < c; i++) {
      const room = { t, x0: x, x1: x + widths[i] - 1, y0: top, y1: floor - 1, floor };
      rooms.push(room);
      if (r() < P.pinFloor) {
        const cells = [];
        for (let xx = room.x0; xx <= room.x1; xx++) { const k = floor * W + xx; g[k] = PIN; cells.push(k); }
        pins.push({ orient: 'h', x0: room.x0, x1: room.x1, y0: floor, y1: floor, cells });
      } else {
        for (let xx = room.x0; xx <= room.x1; xx++) g[floor * W + xx] = WALL;
      }
      x += widths[i];
      if (i < c - 1) {
        g[floor * W + x] = WALL;
        if (r() < P.vpin) {
          const cells = [];
          for (let y = top; y < floor; y++) { const k = y * W + x; g[k] = PIN; cells.push(k); }
          pins.push({ orient: 'v', x0: x, x1: x, y0: top, y1: floor - 1, cells });
        } else {
          for (let y = top; y < floor; y++) g[y * W + x] = WALL;
        }
        x++;
      }
    }
    top = floor + 1;
  }

  const nG = pick(r, P.gold[0], P.gold[1]);
  const nL = pick(r, P.lava[0], P.lava[1]);
  let nW = nL === 0 ? 0 : Math.max(nL === 1 ? 0 : 1, nL + pick(r, -1, 1));
  if (nG + nL > rooms.length) return null;
  nW = Math.min(nW, rooms.length - nG - nL);
  const order = rooms.map((_, i) => i);
  for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  const mats = [];
  for (let i = 0; i < nG; i++) mats.push(GOLD);
  for (let i = 0; i < nL; i++) mats.push(LAVA);
  for (let i = 0; i < nW; i++) mats.push(WATER);
  const cap = { [GOLD]: nG > 1 ? 40 : 60, [LAVA]: 36, [WATER]: 56 };
  mats.forEach((m, i) => {
    const room = rooms[order[i]];
    room.mat = m;
    const w = room.x1 - room.x0 + 1, h = room.y1 - room.y0 + 1;
    let fr = Math.max(2, Math.min(h - 2, Math.round(h * (0.35 + r() * 0.25))));
    fr = Math.max(1, Math.min(fr, Math.floor(cap[m] / w)));
    for (let y = room.y1 - fr + 1; y <= room.y1; y++) for (let x = room.x0; x <= room.x1; x++) g[y * W + x] = m;
  });

  pins.sort((a, b) => a.y0 - b.y0 || a.x0 - b.x0);
  pins.forEach((p, i) => {
    p.id = i;
    for (const k of p.cells) pinOf[k] = i;
    if (p.orient === 'h') p.side = (p.x0 - 1) <= (W - 2 - p.x1) ? -1 : 1;
  });
  const total = goldAll(g);
  return { g, pinOf, pins, rooms, goldTotal: total, target: Math.max(1, Math.ceil(total * P.target)), lava: nL };
}

function solve(lv, budget = 2500) {
  const n = lv.pins.length;
  const F = [1];
  for (let i = 1; i <= n; i++) F[i] = F[i - 1] * i;
  let nodes = 0, wins = 0, best = null, over = false;
  const root = makeSim(lv.g);
  settle(root);
  const ev = s => {
    if (s.lavaHome) return -1;
    // 실제 플레이는 핀을 뽑는 시점이 달라 결과가 조금 흔들리므로 여유분을 둔다
    if (goldHome(s.g) >= lv.target + 3) return 1;
    if (goldAll(s.g) < lv.target) return -1;
    return 0;
  };
  if (ev(root) !== 0) return null;
  (function dfs(s, used, path) {
    for (let p = 0; p < n; p++) {
      if (used & (1 << p)) continue;
      if (++nodes > budget) { over = true; return; }
      const c = cloneSim(s);
      removePin(c.g, lv.pins[p]);
      c.still = 0;
      settle(c);
      const np = path.concat(p), rem = n - np.length, e = ev(c);
      if (e > 0) { wins += F[rem]; if (!best || np.length < best.length) best = np; }
      else if (e === 0 && rem > 0) dfs(c, used | (1 << p), np);
      if (over) return;
    }
  })(root, 0, []);
  if (over || !best) return null;
  return { winFrac: wins / F[n], sol: best };
}

function simpleLevel(P) {
  // 생성에 실패했을 때 쓰는 안전한 기본 판
  const r = rngOf(7);
  const lv = genCandidate({ ...P, tiers: [1, 1], rooms: [1, 1], gold: [1, 1], lava: [0, 0], pinFloor: 1, vpin: 0 }, r);
  lv.sol = [0]; lv.winFrac = 1;
  return lv;
}

function openingLevel(L) {
  const base = simpleLevel(params(L)), g = base.g;
  for (let y=1;y<31;y++) for(let x=1;x<29;x++) g[y*W+x]=E;
  const pins=[], rooms=[];
  const fill=(x0,x1,y0,y1,m)=>{for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)g[y*W+x]=m;};
  const pin=(x0,x1,y)=>{
    const cells=[];for(let x=x0;x<=x1;x++){g[y*W+x]=PIN;cells.push(y*W+x);}
    pins.push({id:pins.length,orient:'h',x0,x1,y0:y,y1:y,cells,side:x0<10?-1:1});
  };
  if(L===1){
    fill(1,28,1,15,WALL); fill(7,22,3,14,E);fill(7,22,12,14,GOLD);
    pin(7,22,15);pin(1,28,27);
    rooms.push({x0:7,x1:22,y0:3,y1:14,mat:GOLD});
  }else{
    const split=L===3?10:15, floor=L===4?15:13;
    fill(split,split,1,floor,WALL);
    fill(1,split-1,floor-3,floor-1,GOLD);
    fill(split+1,28,floor-6,floor-1,WATER);
    pin(1,split-1,floor);pin(split+1,28,floor);
    fill(1,28,25,25,LAVA);pin(1,28,26);
    rooms.push({x0:1,x1:split-1,y0:1,y1:floor-1,mat:GOLD},{x0:split+1,x1:28,y0:1,y1:floor-1,mat:WATER});
    if(L===3){ // Two lower gates make the safe exit a separate decision.
      pins.pop();fill(1,28,26,26,WALL);pin(1,14,26);pin(16,28,26);
    }
    if(L===4){ // A sealed side pocket: leave its red pin alone.
      fill(23,23,17,24,WALL);fill(24,28,17,17,WALL);fill(24,28,18,20,LAVA);
      pin(24,28,24);
    }
  }
  const pinOf=new Int8Array(W*H).fill(-1);
  pins.forEach((p,i)=>{p.id=i;p.cells.forEach(k=>pinOf[k]=i);});
  const lv={g,pinOf,pins,rooms,goldTotal:goldAll(g),target:Math.ceil(goldAll(g)*0.72),L,time:0};
  const res=solve(lv);
  if(!res) return null;
  Object.assign(lv,res);
  lv.name=['','첫 금맥','물을 먼저!','출구는 두 갈래','숨은 용암'][L];
  lv.tip=['','위의 금을 내리고, 아래 문을 열어요','물을 먼저 부어 용암을 식혀 보세요','모든 핀을 뽑을 필요는 없어요','작은 방의 용암도 물이 흐를 때 식혀요'][L];
  return lv;
}

function genLevelRaw(L) {
  if(L<=4){const lv=openingLevel(L);if(lv)return lv;}
  const P = params(L);
  let best = null;
  const t0 = Date.now();
  for (let a = 0; a < 400 && Date.now() - t0 < 4000; a++) {
    const r = rngOf(L * 9973 + a * 131 + 17);
    const c = genCandidate(P, r);
    if (!c) continue;
    if (c.pins.length < P.pins[0] || c.pins.length > P.pins[1]) continue;
    if (c.lava < P.lava[0]) continue;
    const res = solve(c);
    if (!res) continue;
    c.sol = res.sol; c.winFrac = res.winFrac;
    const ok = res.winFrac <= P.maxWin && res.sol.length >= Math.min(P.minSol, c.pins.length);
    if (ok) { best = c; break; }
    if (!best || res.winFrac < best.winFrac) best = c;
  }
  if (!best) best = simpleLevel(P);
  best.L = L;
  best.time = P.time;
  return best;
}

return {
  W, H, CS, GX, GY, E, WALL, PIN, GOLD, WATER, LAVA, STONE, ASH, CART_TOP, CART_L, CART_R, SETTLE,
  makeSim, cloneSim, step, settle, goldHome, goldAll, removePin, params, solve, genLevelRaw,
};
})();
if (typeof window === 'undefined') {
  self.onmessage = e => { const L = e.data; self.postMessage({ L, lv: PMCore.genLevelRaw(L) }); };
}
</script>
<script>
(() => {
'use strict';
const {
  W, H, CS, GX, GY, E, WALL, PIN, GOLD, WATER, LAVA, STONE, ASH, CART_TOP, CART_L, CART_R, SETTLE,
  makeSim, cloneSim, step, goldHome, goldAll, removePin, params, solve, genLevelRaw,
} = PMCore;

// ---------- 화면 ----------
const VW = 400, VH = 720;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const mineArt=new Image();mineArt.src='assets/mine-art.png';
let scale = 1, dpr = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  // Leave a 24px gutter on both sides, including inside a full-width iframe.
  scale = Math.max(0.01, Math.min(1, (innerWidth - 48) / VW, (innerHeight - 24) / VH));
  cv.style.width = Math.floor(VW * scale) + 'px';
  cv.style.height = Math.floor(VH * scale) + 'px';
  cv.width = Math.round(VW * scale * dpr);
  cv.height = Math.round(VH * scale * dpr);
}
addEventListener('resize', resize);
resize();

// 레벨 생성은 워커에서 미리 해 둔다 (워커를 못 쓰면 바로 생성)
const levelCache = new Map(), waiting = new Map();
let worker = null;
try {
  const code = document.getElementById('core').textContent;
  worker = new Worker(URL.createObjectURL(new Blob([code], { type: 'text/javascript' })));
  worker.onmessage = e => {
    const { L, lv } = e.data;
    levelCache.set(L, lv);
    const cbs = waiting.get(L) || [];
    waiting.delete(L);
    cbs.forEach(cb => cb(lv));
  };
  worker.onerror = () => { worker = null; };
} catch (e) { worker = null; }
const requested = new Set();
function requestLevel(L, cb) {
  if (levelCache.has(L)) { if (cb) cb(levelCache.get(L)); return; }
  if (cb) { if (!waiting.has(L)) waiting.set(L, []); waiting.get(L).push(cb); }
  if (requested.has(L) && worker) return;
  requested.add(L);
  if (worker) { worker.postMessage(L); return; }
  setTimeout(() => {
    if (!levelCache.has(L)) levelCache.set(L, genLevelRaw(L));
    const cbs = waiting.get(L) || [];
    waiting.delete(L);
    cbs.forEach(f => f(levelCache.get(L)));
  }, 20);
}
function genLevel(L) {
  if (!levelCache.has(L)) levelCache.set(L, genLevelRaw(L));
  return levelCache.get(L);
}

// ---------- 사운드 ----------
let actx = null, muted = false;
function vibrate(ms){try{if(navigator.vibrate)navigator.vibrate(ms);}catch(e){}}
function audio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } }
  if (actx && actx.state === 'suspended') actx.resume();
}
function beep(f, d = 0.08, type = 'square', v = 0.05, slide = 0) {
  if (!actx || muted) return;
  try {
    const o = actx.createOscillator(), gn = actx.createGain(), t = actx.currentTime;
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
    gn.gain.setValueAtTime(v, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(gn); gn.connect(actx.destination); o.start(t); o.stop(t + d + 0.02);
  } catch (e) {}
}

// ---------- 저장 ----------
function loadBest() { try { return JSON.parse(localStorage.getItem('pinMineBest') || '{}'); } catch (e) { return {}; } }
function saveBest(b) { try { localStorage.setItem('pinMineBest', JSON.stringify(b)); } catch (e) {} }
let best = loadBest();

// ---------- 게임 상태 ----------
const G = {
  state: 'title', level: 1, score: 0, hearts: 3, lv: null, sim: null, pulled: [],
  streak: 0, history: [], hint: -1, hintLife: 0, toast: '', toastLife: 0, assisted: false, elapsed: 0, spark: [], reward: 0,
  timeLeft: 0, msg: '', gain: 0, stars: 0, shake: 0, fx: [], lastHome: 0, speed: 1,
};

function startRun() {
  G.level = 1; G.score = 0; G.hearts = 3; G.streak = 0;
  beginLevel();
}
function beginLevel() {
  G.state = 'gen';
  G.sim = null;
  const L = G.level;
  requestLevel(L, lv => {
    if (G.state !== 'gen' || G.level !== L) return;
    G.lv = lv;
    layoutHandles(lv);
    buildWallLayer(lv);
    resetLevel();
    requestLevel(L + 1);
  });
}
function resetLevel() {

  ctx.moveTo(x, y + s * 0.3);
  ctx.bezierCurveTo(x, y, x - s * 0.5, y, x - s * 0.5, y + s * 0.3);
  ctx.bezierCurveTo(x - s * 0.5, y + s * 0.6, x, y + s * 0.8, x, y + s);
  ctx.bezierCurveTo(x, y + s * 0.8, x + s * 0.5, y + s * 0.6, x + s * 0.5, y + s * 0.3);
  ctx.bezierCurveTo(x + s * 0.5, y, x, y, x, y + s * 0.3);
  ctx.fill();
}

function drawHUD(now) {
  ctx.textBaseline='alphabetic';ctx.textAlign='left';ctx.fillStyle='#f7f4de';ctx.font='bold 22px sans-serif';
  ctx.fillText('광산 '+String(G.level).padStart(2,'0'),20,29);
  for(let i=0;i<3;i++)heart(157+i*20,13,15,i<G.hearts);
  ctx.textAlign='right';ctx.fillStyle='#ffda78';ctx.font='bold 18px sans-serif';ctx.fillText(G.score.toLocaleString(),380,28);
  ctx.font='11px sans-serif';ctx.fillStyle='#91b9b6';ctx.textAlign='left';
  ctx.fillText(G.lv?.name || (G.level%5===0?'깊은 갱도 · 하트 회복 구간':'더 깊은 곳으로'),21,46);
  ctx.textAlign='right';ctx.fillText(G.streak>1?'연속 성공 ×'+G.streak:'PIN MINE',379,46);
  if(!G.lv||!G.sim)return;
  const h=goldHome(G.sim.g),k=Math.min(1,h/G.lv.target),bw=G.lv.time?274:360;
  ctx.fillStyle='#06171c';roundRect(20,55,bw,18,9);ctx.fill();
  if(k){const g=ctx.createLinearGradient(20,0,bw+20,0);g.addColorStop(0,'#e5a534');g.addColorStop(1,k>=1?'#71ebbd':'#ffe28b');ctx.fillStyle=g;roundRect(20,55,Math.max(18,k*bw),18,9);ctx.fill();}
  ctx.fillStyle=k>.55?'#18322d':'#f6eacd';ctx.textAlign='center';ctx.font='bold 11px sans-serif';ctx.fillText('수집 '+h+' / '+G.lv.target,20+bw/2,68);
  if(G.lv.time){ctx.fillStyle=G.timeLeft<10?'#ff997a':'#e6efdf';ctx.textAlign='right';ctx.font='bold 14px sans-serif';ctx.fillText(Math.ceil(G.timeLeft)+'초',380,69);}
}
const BUTTONS=[{x:20,w:84,label:'↶ 한 수',key:'undo'},{x:112,w:84,label:'✦ 힌트',key:'hint'},{x:204,w:84,label:'↻ 다시',key:'reset'},{x:296,w:84,label:'♪ 소리',key:'sound'}];


function drawBottom(now) {
  for(const b of BUTTONS){
    const disabled=b.key==='undo'&&!G.history.length;
    ctx.fillStyle='#020a11';roundRect(b.x,652,b.w,40,10);ctx.fill();const bg=ctx.createLinearGradient(0,649,0,689);bg.addColorStop(0,b.key==='hint'?'#47636a':'#2b424e');bg.addColorStop(1,'#14232e');ctx.fillStyle=bg;roundRect(b.x,649,b.w,40,10);ctx.fill();
    ctx.strokeStyle=b.key==='hint'?'#d8b874':'#8ba4ad66';ctx.lineWidth=1;ctx.stroke();
    ctx.fillStyle=disabled?'#69858a':'#f5e9c8';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold 13px sans-serif';
    ctx.fillText(b.key==='sound'&&muted?'♪ 꺼짐':b.label,b.x+b.w/2,670);
  }
  ctx.textAlign='center';ctx.font='11px sans-serif';ctx.fillStyle='#9cbbb6';
  ctx.fillText(G.toastLife>0?G.toast:(G.sim.still>250?'막혔다면 한 수 되돌리거나 힌트를 보세요':'금은 수레로 · 물 + 용암 = 돌 · Z 되돌리기'),200,706);
}


function panel(title, lines, btn, color = '#ffcf33') {
  ctx.fillStyle = 'rgba(10,6,18,0.72)'; ctx.fillRect(0, 0, VW, VH);
  ctx.fillStyle = '#163c40'; roundRect(30, 200, 340, 320, 24); ctx.fill();
  ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.stroke();
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = color; ctx.font = 'bold 32px sans-serif'; ctx.fillText(title, 200, 266);
  ctx.fillStyle = '#fff'; ctx.font = '17px sans-serif';
  lines.forEach((l, i) => ctx.fillText(l, 200, 312 + i * 30));
  ctx.fillStyle = color; roundRect(110, 430, 180, 54, 27); ctx.fill();
  ctx.fillStyle = '#1b1020'; ctx.font = 'bold 20px sans-serif'; ctx.textBaseline = 'middle';
  ctx.fillText(btn, 200, 458);
}
function star(x, y, r, on) {
  ctx.fillStyle = on ? '#ffd23f' : 'rgba(255,255,255,0.15)';
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
    ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  ctx.closePath(); ctx.fill();
}

function drawTitle(now) {
  ctx.textAlign='center';ctx.textBaseline='alphabetic';
  ctx.fillStyle='#f0c985';ctx.font='bold 11px sans-serif';ctx.fillText('A LITTLE MINER. A GOLDEN ADVENTURE.',200,91);
  ctx.shadowColor='#000';ctx.shadowBlur=15;ctx.shadowOffsetY=4;
  const gold=ctx.createLinearGradient(0,112,0,171);gold.addColorStop(0,'#fff4cf');gold.addColorStop(.5,'#ffdc85');gold.addColorStop(1,'#bd7c26');
  ctx.fillStyle=gold;ctx.font='900 45px sans-serif';ctx.fillText('금광 두더지',200,151);ctx.shadowBlur=0;ctx.shadowOffsetY=0;
  ctx.fillStyle='#b5d0d0';ctx.font='bold 12px sans-serif';ctx.fillText('P I N   M I N E',200,181);
  ctx.fillStyle='#e5e6d7';ctx.font='15px sans-serif';ctx.fillText('깊은 광산, 빛나는 한 수.',200,230);
  ctx.fillStyle='#92b7bf';ctx.font='12px sans-serif';ctx.fillText('핀을 뽑아 두더지의 황금을 구하세요',200,254);
  ctx.save();ctx.shadowColor='#e9ac4b55';ctx.shadowBlur=22+5*Math.sin(now/700);
  const g=ctx.createLinearGradient(0,288,0,347);g.addColorStop(0,'#ffebb5');g.addColorStop(.48,'#eec36c');g.addColorStop(1,'#b77b30');
  ctx.fillStyle='#69451d';roundRect(75,293,250,58,15);ctx.fill();ctx.fillStyle=g;roundRect(75,288,250,58,15);ctx.fill();ctx.shadowBlur=0;
  ctx.strokeStyle='#fff0c1';ctx.lineWidth=1;roundRect(79,292,242,49,12);ctx.stroke();ctx.fillStyle='#392c1c';ctx.font='bold 20px sans-serif';ctx.fillText('광산으로 출발  →',200,323);ctx.restore();
  ctx.fillStyle='#b7cbc8';ctx.font='11px sans-serif';ctx.fillText('한 수 되돌리기 · 힌트 · 나만의 최고 기록',200,374);
  const shade=ctx.createLinearGradient(0,650,0,720);shade.addColorStop(0,'#03101b00');shade.addColorStop(1,'#03101bee');ctx.fillStyle=shade;ctx.fillRect(0,650,400,70);
  ctx.fillStyle='#f4dba6';ctx.font='11px sans-serif';ctx.fillText(best.level?'최고 광산 '+best.level+'  /  '+(best.score||0).toLocaleString()+'점':'당신의 첫 번째 금맥이 기다립니다',200,696);
}

function render(now) {
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  drawBackground(now);
  if (G.state === 'title') { drawTitle(now); return; }
  if (G.state === 'gen' || !G.sim) {
    drawHUD(now);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = 'bold 26px sans-serif';
    ctx.fillText('레벨 ' + G.level, 200, 330);
    ctx.font = '16px sans-serif'; ctx.fillStyle = '#c8b6e8';
    ctx.fillText('갱도를 파는 중…', 200, 362);
    return;
  }
  ctx.save();
  if (G.shake > 0) ctx.translate((Math.random() - 0.5) * G.shake, (Math.random() - 0.5) * G.shake);
  drawHUD(now);
  drawGrid(now);
  drawBottom(now);
  ctx.restore();
  for(const f of G.spark){ctx.globalAlpha=Math.max(0,f.life);ctx.fillStyle=f.color;ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.life*6);ctx.fillRect(-2,-2,5,5);ctx.restore();}ctx.globalAlpha=1;
  const since = now - (G.overAt || 0);
  if (G.state === 'win' && since > 500) {
    panel('레벨 클리어!', ['', '+' + G.gain.toLocaleString() + '점', G.bonusHeart ? '하트 1개 회복!' : G.reward ? '연속 '+G.streak+'회! +'+G.reward+' 보너스' : G.assisted?'다음에는 도움 없이 도전!':'완벽한 한 수를 향해!' ], '다음 레벨 ▶', '#7ee081');
    for (let i = 0; i < 3; i++) star(140 + i * 60, 300, 22, i < G.stars);
  } else if (G.state === 'fail' && since > 600) {
    panel('실패', [G.msg, '남은 하트 ' + G.hearts + '개', G.history.length?'↶ 한 수 되돌리기 (Z / 여기를 탭)':'다른 핀 순서를 생각해 보세요'], '다시 도전', '#ff8a5c');
  } else if (G.state === 'over' && since > 600) {
    panel('게임 오버', [G.msg, '광산 ' + G.level + ' · ' + G.score.toLocaleString() + '점', G.history.length?'↶ 한 수 되돌리기 (Z / 여기를 탭)':'최고 '+best.score.toLocaleString()+'점'], '처음부터', '#ff6b6b');
  }
}

// ---------- 입력 ----------
function toLogical(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * VW, y: (e.clientY - r.top) / r.height * VH };
}
function pinAt(px, py) {
  const x = px - GX, y = py - GY;
  let bi = -1, bd = 1e9;
  G.lv.pins.forEach((p, i) => {
    if (G.pulled[i] >= 0) return;
    const gm = pinGeom(p);
    let d;
    if (p.orient === 'h') {
      const dx = x < gm.a ? gm.a - x : x > gm.b ? x - gm.b : 0;
      d = Math.hypot(dx, y - gm.cy);
    } else {
      const dy = y < gm.a ? gm.a - y : y > gm.b ? y - gm.b : 0;
      d = Math.hypot(x - gm.cx, dy);
    }
    d = Math.min(d, Math.hypot(x - gm.hx, y - gm.hy) - 4);
    if (d < bd) { bd = d; bi = i; }
  });
  return bd <= 18 ? bi : -1;
}
function confirmOverlay() {
  const since = performance.now() - (G.overAt || 0);
  if (G.state === 'title') { startRun(); return true; }
  if (G.state === 'win' && since > 500) { nextLevel(); return true; }
  if (G.state === 'fail' && since > 600) { resetLevel(); return true; }
  if (G.state === 'over' && since > 600) { startRun(); return true; }
  return false;
}
// A scroll cancels the pointer; only a completed tap should pull a pin.
cv.addEventListener('pointerup', e => {
  audio();
  const p = toLogical(e);
  if(['fail','over'].includes(G.state)&&p.y>=365&&p.y<=405&&G.history.length){undoMove();return;}
  if (G.state !== 'play') { confirmOverlay(); return; }
  if(p.y>=649&&p.y<=689){const b=BUTTONS.find(b=>p.x>=b.x&&p.x<=b.x+b.w);if(b){if(b.key==='undo')undoMove();if(b.key==='hint')showHint();if(b.key==='reset')resetLevel();if(b.key==='sound')muted=!muted;return;}}
  const i = pinAt(p.x, p.y);
  if (i >= 0) pullPin(i);
});
addEventListener('keydown', e => {
  audio();
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); confirmOverlay(); return; }
  if(e.key.toLowerCase()==='z'){undoMove();return;}
  if (G.state !== 'play') return;
  if(e.key.toLowerCase()==='h'){showHint();return;}
  if (e.key === 'r' || e.key === 'R') { resetLevel(); return; }
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 9) pullPin(n - 1);
});

// ---------- 루프 ----------
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  if (!document.hidden) update(dt);
  render(now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
requestLevel(1);

// 자동 테스트용 접근점
window.PinMine = {
  G, params, genLevel, solve, pullPin, startRun, nextLevel, resetLevel, confirmOverlay, undoMove, showHint,
  goldHome: () => goldHome(G.sim.g),
  advance: (sec) => { for (let t = 0; t < sec; t += 1 / 60) update(1 / 60); },
};
})();
</script>
